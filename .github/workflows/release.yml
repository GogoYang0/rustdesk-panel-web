name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          case "$version" in
            *-rc.*|*-beta.*|*-alpha.*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)                         echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          NAME="rustdesk-panel-web_${VERSION}_dist"
          mkdir -p out
          cp -r dist "${NAME}"
          tar -czf "out/${NAME}.tar.gz" "${NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: out/*

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: sha256sums
        working-directory: out
        run: |
          rm -f SHA256SUMS.txt
          sha256sum *.tar.gz > SHA256SUMS.txt
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          ARGS=(--title "rustdesk-panel-web v${VERSION}" --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then ARGS+=(--prerelease); fi
          gh release create "v${VERSION}" out/* "${ARGS[@]}"
